name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'LICENSE'

# Prevent concurrent executions to avoid race conditions with version incrementing
concurrency:
  group: release-workflow
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Check if triggered by version bump
      id: check_trigger
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if [[ "$COMMIT_MSG" == *"[skip release]"* ]]; then
          echo "Skipping release - triggered by automated version bump"
          echo "SKIP_RELEASE=true" >> $GITHUB_ENV
        else
          echo "SKIP_RELEASE=false" >> $GITHUB_ENV
        fi
        
    - name: Set up JDK 17
      if: env.SKIP_RELEASE == 'false'
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
        
    - name: Grant execute permission for gradlew
      if: env.SKIP_RELEASE == 'false'
      run: chmod +x gradlew
      
    - name: Extract and increment version
      if: env.SKIP_RELEASE == 'false'
      id: get_version
      run: |
        # Fetch latest tags to ensure we have up-to-date information
        git fetch --tags
        
        VERSION_NAME=$(grep "versionName" app/build.gradle | awk '{print $2}' | tr -d '"' | tr -d ' ')
        VERSION_CODE=$(grep "versionCode" app/build.gradle | awk '{print $2}' | tr -d ' ')
        
        # Validate extracted values
        if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
          echo "Error: Failed to extract version from app/build.gradle"
          echo "VERSION_NAME=$VERSION_NAME, VERSION_CODE=$VERSION_CODE"
          exit 1
        fi
        
        echo "Current version: $VERSION_NAME (Build $VERSION_CODE)"
        
        # Check if tag with current version exists
        CURRENT_TAG="v${VERSION_NAME}-${VERSION_CODE}"
        if git rev-parse "$CURRENT_TAG" >/dev/null 2>&1; then
          echo "Tag $CURRENT_TAG already exists, incrementing version..."
          # Increment versionCode
          NEW_VERSION_CODE=$((VERSION_CODE + 1))
          
          # Update build.gradle with new versionCode (handle varying whitespace)
          sed -i "s/versionCode[[:space:]]*$VERSION_CODE/versionCode $NEW_VERSION_CODE/" app/build.gradle
          
          echo "Incremented versionCode from $VERSION_CODE to $NEW_VERSION_CODE"
          VERSION_CODE=$NEW_VERSION_CODE
          
          # Commit and push the version bump
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle
          git commit -m "Bump versionCode to $NEW_VERSION_CODE [skip release]"
          
          # Push with error handling and retry logic
          MAX_RETRIES=3
          RETRY_COUNT=0
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if git push; then
              echo "Successfully pushed version bump"
              break
            else
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -lt $MAX_RETRIES ]; then
                echo "Push failed, retrying ($RETRY_COUNT/$MAX_RETRIES)..."
                sleep 2
                git pull --rebase
              else
                echo "Error: Failed to push version bump after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done
        else
          echo "Tag $CURRENT_TAG does not exist, using current version"
        fi
        
        echo "VERSION_NAME=${VERSION_NAME}" >> $GITHUB_ENV
        echo "VERSION_CODE=${VERSION_CODE}" >> $GITHUB_ENV
        echo "TAG=v${VERSION_NAME}-${VERSION_CODE}" >> $GITHUB_ENV
        
    - name: Build release APK
      if: env.SKIP_RELEASE == 'false'
      run: ./gradlew assembleRelease
      
    - name: Rename APK
      if: env.SKIP_RELEASE == 'false'
      run: |
        mkdir -p release-artifacts
        
        # The APK should be signed with debug keystore (configured in build.gradle)
        # Try to find the APK file (prefer signed over unsigned)
        if [ -f app/build/outputs/apk/release/app-release.apk ]; then
          cp app/build/outputs/apk/release/app-release.apk release-artifacts/NewsCorrelator-${{ env.TAG }}.apk
          echo "✓ Found and copied signed APK"
        elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
          cp app/build/outputs/apk/release/app-release-unsigned.apk release-artifacts/NewsCorrelator-${{ env.TAG }}.apk
          echo "⚠ Warning: Using unsigned APK - this may not install on devices"
        else
          echo "Error: Could not find release APK file"
          ls -la app/build/outputs/apk/release/ || echo "Release directory not found"
          exit 1
        fi
        
    - name: Generate changelog
      if: env.SKIP_RELEASE == 'false'
      id: changelog
      run: |
        # Get commits since last tag
        LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
        
        # Create changelog file
        echo "# What's Changed" > CHANGELOG.md
        echo "" >> CHANGELOG.md
        
        if [ -z "$LAST_TAG" ]; then
          # First release - list all commits
          git log --pretty=format:"- %s" --no-merges >> CHANGELOG.md
        else
          # List commits since last tag
          git log ${LAST_TAG}..HEAD --pretty=format:"- %s" --no-merges >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "" >> CHANGELOG.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${LAST_TAG}...${{ env.TAG }}" >> CHANGELOG.md
        fi
        
    - name: Create Release
      if: env.SKIP_RELEASE == 'false'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG }}
        name: NewsCorrelator ${{ env.VERSION_NAME }} (Build ${{ env.VERSION_CODE }})
        body_path: CHANGELOG.md
        files: |
          release-artifacts/NewsCorrelator-${{ env.TAG }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        

